<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Mark Hembrom — AI and software engineering solar system</title>
  <desc id="desc">A dark space-themed developer banner with an artificial intelligence core and orbiting software technologies.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#7dcfff"/>
      <stop offset="0.6" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0caf5"/>
      <stop offset="0.5" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#space)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#7aa2f7" stroke-opacity="0.3"/>

  <g fill="#c0caf5">
    <circle cx="84" cy="54" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="89" r="1"><animate attributeName="opacity" values="1;0.15;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="347" cy="49" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="502" cy="102" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="692" cy="45" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="72" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1152" cy="322" r="1.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="604" cy="360" r="1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="327" cy="337" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="132" fill="#7dcfff" font-size="17" font-weight="700" letter-spacing="4">SOFTWARE · SYSTEMS · INTELLIGENCE</text>
    <text x="68" y="205" fill="url(#titleGradient)" font-size="52" font-weight="800" letter-spacing="-1">AYUSH MARK HEMBROM</text>
    <text x="72" y="251" fill="#a9b1d6" font-size="22" font-weight="500">3rd-Year ECE Undergraduate · Full-Stack Developer</text>
    <text x="72" y="288" fill="#7aa2f7" font-size="18">Java / Spring Boot · Next.js / TypeScript · AI-enabled applications</text>

    <g transform="translate(72 327)">
      <rect width="375" height="42" rx="21" fill="#101a36" stroke="#7aa2f7" stroke-opacity="0.45"/>
      <circle cx="24" cy="21" r="6" fill="#9ece6a" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="27" fill="#c0caf5" font-size="14" font-weight="650" letter-spacing="1.4">BUILDING RELIABLE PRODUCTS THAT SHIP</text>
    </g>
  </g>

  <g transform="translate(932 210)">
    <ellipse rx="105" ry="43" fill="none" stroke="#7dcfff" stroke-opacity="0.26" stroke-width="1.4" transform="rotate(-14)"/>
    <ellipse rx="158" ry="73" fill="none" stroke="#7aa2f7" stroke-opacity="0.23" stroke-width="1.3" transform="rotate(18)"/>
    <ellipse rx="213" ry="107" fill="none" stroke="#bb9af7" stroke-opacity="0.2" stroke-width="1.2" transform="rotate(-8)"/>

    <circle r="56" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="52;58;52" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#111b38" stroke="#7dcfff" stroke-width="1.5"/>
    <text x="0" y="7" text-anchor="middle" fill="#e0e7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">AI</text>
    <text x="0" y="66" text-anchor="middle" fill="#7dcfff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">CORE</text>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle cx="105" cy="0" r="15" fill="#f7768e" stroke="#ffd6de" stroke-opacity="0.6"/>
      <text x="105" y="4" text-anchor="middle" fill="#11111b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="800">JAVA</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="90" to="-270" dur="28s" repeatCount="indefinite"/>
      <circle cx="158" cy="0" r="18" fill="#9ece6a" stroke="#d8f5bd" stroke-opacity="0.55"/>
      <text x="158" y="3" text-anchor="middle" fill="#10150d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5" font-weight="800">SPRING</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="185" to="545" dur="38s" repeatCount="indefinite"/>
      <circle cx="213" cy="0" r="17" fill="#7dcfff" stroke="#d5f4ff" stroke-opacity="0.55"/>
      <text x="213" y="3" text-anchor="middle" fill="#07131c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="800">API</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="300" to="-60" dur="34s" repeatCount="indefinite"/>
      <circle cx="-198" cy="0" r="16" fill="#bb9af7" stroke="#eadcff" stroke-opacity="0.55"/>
      <text x="-198" y="3" text-anchor="middle" fill="#150d20" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5" font-weight="800">NEXT</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="31s" repeatCount="indefinite"/>
      <circle cx="-148" cy="0" r="14" fill="#e0af68" stroke="#fff0c9" stroke-opacity="0.55"/>
      <text x="-148" y="3" text-anchor="middle" fill="#1d1406" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5" font-weight="800">DATA</text>
    </g>
  </g>
</svg>
