<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Mark Hembrom — Data Analytics, Financial Analysis and Business Intelligence</title>
  <desc id="desc">A dark analytics banner with a data core and analytical tools moving along elliptical orbits.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#7dcfff"/>
      <stop offset="0.6" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0caf5"/>
      <stop offset="0.5" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="planetGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#space)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#7aa2f7" stroke-opacity="0.3"/>

  <g fill="#c0caf5">
    <circle cx="84" cy="54" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="89" r="1"><animate attributeName="opacity" values="1;0.15;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="347" cy="49" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="502" cy="102" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="692" cy="45" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="72" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1152" cy="322" r="1.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="604" cy="360" r="1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="327" cy="337" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="132" fill="#7dcfff" font-size="16" font-weight="700" letter-spacing="2">DATA · FINANCE · BUSINESS INTELLIGENCE</text>
    <text x="68" y="205" fill="url(#titleGradient)" font-size="52" font-weight="800" letter-spacing="-1">AYUSH MARK HEMBROM</text>
    <text x="72" y="251" fill="#a9b1d6" font-size="22" font-weight="500">Analyst · Finance &amp; Business Intelligence</text>
    <text x="72" y="288" fill="#7aa2f7" font-size="18">Excel · SQL · Python · Power BI · Tableau</text>

    <g transform="translate(72 327)">
      <rect width="375" height="42" rx="21" fill="#101a36" stroke="#7aa2f7" stroke-opacity="0.45"/>
      <circle cx="24" cy="21" r="6" fill="#9ece6a" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="27" fill="#c0caf5" font-size="14" font-weight="650" letter-spacing="1.4">TURNING DATA INTO CLEAR INSIGHTS</text>
    </g>
  </g>

  <g transform="translate(945 210)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <!-- Every planet follows the same geometry as its visible orbit. -->
    <g transform="rotate(-16)">
      <path d="M115 0 A115 66 0 1 1 -115 0 A115 66 0 1 1 115 0" fill="none" stroke="#7dcfff" stroke-opacity="0.34" stroke-width="1.45"/>
      <g>
        <animateMotion path="M115 0 A115 66 0 1 1 -115 0 A115 66 0 1 1 115 0" dur="17s" begin="-3s" repeatCount="indefinite" rotate="0" calcMode="linear"/>
        <g transform="rotate(16)" filter="url(#planetGlow)">
          <circle r="15" fill="#f7768e" stroke="#ffd6de" stroke-opacity="0.68"/>
          <text y="3" text-anchor="middle" fill="#11111b" font-size="8" font-weight="800">SQL</text>
        </g>
      </g>
    </g>

    <g transform="rotate(13)">
      <path d="M150 0 A150 82 0 1 0 -150 0 A150 82 0 1 0 150 0" fill="none" stroke="#7aa2f7" stroke-opacity="0.29" stroke-width="1.35"/>
      <g>
        <animateMotion path="M150 0 A150 82 0 1 0 -150 0 A150 82 0 1 0 150 0" dur="25s" begin="-12s" repeatCount="indefinite" rotate="0" calcMode="linear"/>
        <g transform="rotate(-13)" filter="url(#planetGlow)">
          <circle r="18" fill="#9ece6a" stroke="#d8f5bd" stroke-opacity="0.62"/>
          <text y="3" text-anchor="middle" fill="#10150d" font-size="7.5" font-weight="800">EXCEL</text>
        </g>
      </g>
    </g>

    <g transform="rotate(-7)">
      <path d="M182 0 A182 98 0 1 1 -182 0 A182 98 0 1 1 182 0" fill="none" stroke="#7dcfff" stroke-opacity="0.25" stroke-width="1.3" stroke-dasharray="3 5"/>
      <g>
        <animateMotion path="M182 0 A182 98 0 1 1 -182 0 A182 98 0 1 1 182 0" dur="31s" begin="-21s" repeatCount="indefinite" rotate="0" calcMode="linear"/>
        <g transform="rotate(7)" filter="url(#planetGlow)">
          <circle r="16" fill="#7dcfff" stroke="#d5f4ff" stroke-opacity="0.62"/>
          <text y="3" text-anchor="middle" fill="#07131c" font-size="8" font-weight="800">PY</text>
        </g>
      </g>
    </g>

    <g transform="rotate(10)">
      <path d="M213 0 A213 116 0 1 0 -213 0 A213 116 0 1 0 213 0" fill="none" stroke="#bb9af7" stroke-opacity="0.24" stroke-width="1.25"/>
      <g>
        <animateMotion path="M213 0 A213 116 0 1 0 -213 0 A213 116 0 1 0 213 0" dur="38s" begin="-8s" repeatCount="indefinite" rotate="0" calcMode="linear"/>
        <g transform="rotate(-10)" filter="url(#planetGlow)">
          <circle r="17" fill="#bb9af7" stroke="#eadcff" stroke-opacity="0.62"/>
          <text y="3" text-anchor="middle" fill="#150d20" font-size="7.5" font-weight="800">BI</text>
        </g>
      </g>
    </g>

    <g transform="rotate(-9)">
      <path d="M242 0 A242 134 0 1 1 -242 0 A242 134 0 1 1 242 0" fill="none" stroke="#e0af68" stroke-opacity="0.2" stroke-width="1.15" stroke-dasharray="2 7"/>
      <g>
        <animateMotion path="M242 0 A242 134 0 1 1 -242 0 A242 134 0 1 1 242 0" dur="46s" begin="-29s" repeatCount="indefinite" rotate="0" calcMode="linear"/>
        <g transform="rotate(9)" filter="url(#planetGlow)">
          <circle r="15" fill="#e0af68" stroke="#fff0c9" stroke-opacity="0.62"/>
          <text y="3" text-anchor="middle" fill="#1d1406" font-size="5.5" font-weight="800">TABLEAU</text>
        </g>
      </g>
    </g>

    <circle r="57" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="53;59;53" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="35" fill="#111b38" stroke="#7dcfff" stroke-width="1.6"/>
    <circle r="45" fill="none" stroke="#7aa2f7" stroke-opacity="0.46" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.65;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="7" text-anchor="middle" fill="#e0e7ff" font-size="16" font-weight="800">DATA</text>
    <text x="0" y="69" text-anchor="middle" fill="#7dcfff" font-size="10" font-weight="700" letter-spacing="2">CORE</text>
  </g>
</svg>
